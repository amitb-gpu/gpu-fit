# GPU spec + price table.
#
# vram_gb      : usable device memory, GiB
# mem_bw_gbps  : peak memory bandwidth, GB/s (decimal) — drives decode throughput
# fp16_tflops  : peak tensor FP16 throughput (informational; prefill-bound only)
# usd_per_hr   : approximate on-demand price, blended hyperscaler/community, as of 2026-07.
#                PRICES MOVE. Edit these to match the cloud you actually rent from.
# local        : true = a card you own, not rented (usd_per_hr omitted)
#
# Add your own rows freely — the tool reads this file at runtime.

