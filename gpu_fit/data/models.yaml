# Model architecture table.
#
# params_b   : parameter count in billions
# n_layers   : transformer blocks
# hidden     : hidden size
# n_heads    : attention (query) heads
# n_kv_heads : key/value heads (GQA) — drives KV-cache size
# head_dim   : dimension per head
# hf_id      : Hugging Face repo id, used to emit a runnable `vllm serve` command
#
# Any name is matched case-insensitively and by loose alias (e.g. "llama3-8b").

